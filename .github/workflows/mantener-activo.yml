name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 días, 12:00 UTC
  workflow_dispatch:          # permite ejecutarlo a mano para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/perfiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo "Consulta realizada correctamente"