<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
  <title id="t">Corte A-A de la vivienda modelo</title>
  <desc id="d">Corte transversal a 3.00 m, mirando al norte. Muestra la sala, la puerta P2 en el muro interior, el dormitorio y la ventana V3 en el muro este. Al fondo se ve el paso a la cocina con la ventana V2.</desc>
  <rect width="760" height="390" fill="#ffffff"/>

  <!-- Fondo: muros vistos (no cortados) -->
  <rect x="76" y="92" width="608" height="208" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <!-- Paso a la cocina visto al fondo, con ventana V2 -->
  <rect x="180" y="132" width="96" height="168" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
  <g id="V2" stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <rect x="180" y="132" width="96" height="80"/>
    <line x1="228" y1="132" x2="228" y2="212"/>
  </g>

  <!-- Elementos cortados (negro) -->
  <g fill="#1f2937">
    <rect x="60"  y="80"  width="640" height="12"/>
    <rect x="60"  y="92"  width="16"  height="208"/>
    <rect x="684" y="92"  width="16"  height="40"/>
    <rect x="684" y="228" width="16"  height="72"/>
    <rect x="456" y="92"  width="8"   height="40"/>
  </g>

  <!-- Ventana V3 en el muro este (en el corte) -->
  <g id="V3" stroke="#1f2937" stroke-width="1.5" fill="#ffffff">
    <rect x="684" y="132" width="16" height="96"/>
    <line x1="692" y1="132" x2="692" y2="228"/>
  </g>

  <!-- Línea de piso -->
  <line x1="40" y1="300" x2="720" y2="300" stroke="#1f2937" stroke-width="3"/>

  <!-- Etiquetas -->
  <g font-size="14" fill="#111827">
    <text x="366" y="270" text-anchor="middle">Sala-comedor</text>
    <text x="574" y="270" text-anchor="middle">Dormitorio</text>
    <text x="228" y="176" text-anchor="middle">V2</text>
    <text x="228" y="262" text-anchor="middle">Paso</text>
    <text x="470" y="215">P2</text>
    <text x="678" y="185" text-anchor="end">V3</text>
  </g>

  <!-- Cotas -->
  <g stroke="#374151" stroke-width="1" fill="#374151" font-size="12" text-anchor="middle">
    <line x1="44" y1="92" x2="44" y2="300"/>
    <line x1="38" y1="92" x2="50" y2="92"/><line x1="38" y1="300" x2="50" y2="300"/>
    <text x="34" y="196" stroke="none" transform="rotate(-90 34 196)">2.60 m (libre)</text>

    <line x1="718" y1="80" x2="718" y2="300"/>
    <line x1="712" y1="80" x2="724" y2="80"/><line x1="712" y1="300" x2="724" y2="300"/>
    <text x="738" y="190" stroke="none" transform="rotate(-90 738 190)">2.75 m (total)</text>
  </g>

  <!-- Orientación, títulos y leyenda -->
  <g font-size="14" fill="#111827">
    <text x="60" y="322">Oeste</text>
    <text x="700" y="322" text-anchor="end">Este</text>
    <text x="380" y="352" text-anchor="middle" font-size="16" font-weight="bold">Corte A-A (y = 3.00 m, mirando al norte)</text>
    <text x="380" y="374" text-anchor="middle" font-size="12">Negro: elementos cortados. Gris: elementos vistos al fondo.</text>
  </g>
</svg>