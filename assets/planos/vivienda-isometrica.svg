<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" font-family="Arial, sans-serif">
  <title>Vista isométrica de la vivienda modelo</title>

  <!-- Caras: este, sur y techo -->
  <polygon points="421.7,150 255.4,246 255.4,334 421.7,238" fill="#d8e8f6" stroke="#0b5ea8" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="33.8,118 255.4,246 255.4,334 33.8,206" fill="#eaf3fb" stroke="#0b5ea8" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="200,22 421.7,150 255.4,246 33.8,118" fill="#f8fbff" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Aristas ocultas (estilo plano técnico) -->
  <g fill="none" stroke="#0b5ea8" stroke-width="1.2" stroke-dasharray="5 4" opacity=".4">
    <polyline points="33.8,206 200,110 421.7,238"/>
    <line x1="200" y1="110" x2="200" y2="22"/>
  </g>

  <!-- Puerta P1 y ventana V1 (cara sur) -->
  <g fill="#ffffff" stroke="#0b5ea8" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="62.9,222.8 87.8,237.2 87.8,170 62.9,155.6"/>
    <polygon points="116.9,225.2 155.7,247.6 155.7,209.2 116.9,186.8"/>
    <!-- Ventanas V3 y V4 (cara este) -->
    <polygon points="355.1,247.6 321.9,266.8 321.9,228.4 355.1,209.2"/>
    <polygon points="294.2,260.4 277.6,270 277.6,250.8 294.2,241.2"/>
  </g>
  <g stroke="#0b5ea8" stroke-width="1.2">
    <line x1="136.3" y1="198" x2="136.3" y2="236.4"/>
    <line x1="338.5" y1="218.8" x2="338.5" y2="257.2"/>
  </g>

  <!-- Cotas -->
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" fill="#b45309">
    <line x1="22.8" y1="225" x2="244.4" y2="353"/>
    <line x1="266.4" y1="353" x2="432.7" y2="257"/>
    <line x1="20" y1="118" x2="20" y2="206"/>
  </g>
  <g fill="#b45309">
    <circle cx="22.8" cy="225" r="2.5"/><circle cx="244.4" cy="353" r="2.5"/>
    <circle cx="266.4" cy="353" r="2.5"/><circle cx="432.7" cy="257" r="2.5"/>
    <circle cx="20" cy="118" r="2.5"/><circle cx="20" cy="206" r="2.5"/>
  </g>
  <g font-size="14" font-weight="700" fill="#92400e" text-anchor="middle" dominant-baseline="central" stroke="#f7fafd" stroke-width="5" paint-order="stroke">
    <text x="133.6" y="289" transform="rotate(30 133.6 289)">8,00 m</text>
    <text x="349.6" y="305" transform="rotate(-30 349.6 305)">6,00 m</text>
    <text x="10" y="162" transform="rotate(-90 10 162)">2,75 m</text>
  </g>
</svg>