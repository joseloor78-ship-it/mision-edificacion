<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="t d" font-family="Arial, sans-serif">
  <title id="t">Planta arquitectónica de la vivienda modelo</title>
  <desc id="d">Planta rectangular de 8.00 por 6.00 metros con sala-comedor, cocina, dormitorio y baño. Tres puertas, un paso libre a la cocina y cuatro ventanas.</desc>
  <rect width="760" height="600" fill="#ffffff"/>

  <!-- Muros -->
  <g id="muros" fill="#1f2937">
    <rect x="60"  y="60"  width="640" height="16"/>
    <rect x="60"  y="524" width="640" height="16"/>
    <rect x="60"  y="60"  width="16"  height="480"/>
    <rect x="684" y="60"  width="16"  height="480"/>
    <rect x="456" y="76"  width="8"   height="448"/>
    <rect x="76"  y="216" width="380" height="8"/>
    <rect x="464" y="376" width="220" height="8"/>
  </g>

  <!-- Huecos en muros -->
  <g fill="#ffffff">
    <rect x="144" y="524" width="72" height="16"/>
    <rect x="456" y="264" width="8"  height="72"/>
    <rect x="456" y="420" width="8"  height="64"/>
    <rect x="180" y="216" width="96" height="8"/>
  </g>

  <!-- Ventanas -->
  <g stroke="#1f2937" stroke-width="1.5" fill="#ffffff">
    <g id="V1"><rect x="300" y="524" width="112" height="16"/><line x1="300" y1="532" x2="412" y2="532"/></g>
    <g id="V2"><rect x="180" y="60"  width="96"  height="16"/><line x1="180" y1="68"  x2="276" y2="68"/></g>
    <g id="V3"><rect x="684" y="252" width="16"  height="96"/><line x1="692" y1="252" x2="692" y2="348"/></g>
    <g id="V4"><rect x="684" y="428" width="16"  height="48"/><line x1="692" y1="428" x2="692" y2="476"/></g>
  </g>

  <!-- Puertas (hoja y giro) -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <g id="P1"><line x1="144" y1="524" x2="144" y2="452"/><path d="M144 452 A72 72 0 0 1 216 524"/></g>
    <g id="P2"><line x1="456" y1="264" x2="528" y2="264"/><path d="M528 264 A72 72 0 0 1 456 336"/></g>
    <g id="P3"><line x1="456" y1="420" x2="520" y2="420"/><path d="M520 420 A64 64 0 0 1 456 484"/></g>
  </g>

  <!-- Nombres de espacios -->
  <g font-size="16" text-anchor="middle" fill="#111827">
    <text x="266" y="378">Sala-comedor</text>
    <text x="266" y="150">Cocina</text>
    <text x="574" y="230">Dormitorio</text>
    <text x="574" y="458">Baño</text>
  </g>

  <!-- Cotas generales -->
  <g stroke="#374151" stroke-width="1" fill="#374151" font-size="14" text-anchor="middle">
    <line x1="60" y1="36" x2="700" y2="36"/>
    <line x1="60" y1="30" x2="60" y2="42"/><line x1="700" y1="30" x2="700" y2="42"/>
    <text x="380" y="28" stroke="none">8.00 m</text>
    <line x1="24" y1="60" x2="24" y2="540"/>
    <line x1="18" y1="60" x2="30" y2="60"/><line x1="18" y1="540" x2="30" y2="540"/>
    <text x="12" y="300" stroke="none" transform="rotate(-90 12 300)">6.00 m</text>
  </g>

  <!-- Línea de corte A-A (y = 3.00 m) -->
  <g stroke="#b91c1c" fill="#b91c1c" font-size="16" font-weight="bold">
    <line x1="48" y1="300" x2="712" y2="300" stroke-dasharray="14 6 2 6" stroke-width="1.5"/>
    <text x="34"  y="305" stroke="none">A</text>
    <text x="718" y="305" stroke="none">A</text>
  </g>
</svg>