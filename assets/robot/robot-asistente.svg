<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Robot asistente de Misión Edificación</title>
  <desc id="d">Robot azul con casco de obra naranja, ojos redondos luminosos y un rollo de planos bajo el brazo.</desc>

  <!-- sombra -->
  <ellipse cx="200" cy="420" rx="110" ry="12" fill="#0B1F3A" opacity="0.15"/>

  <!-- antena -->
  <line x1="200" y1="62" x2="200" y2="30" stroke="#0B1F3A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="24" r="9" fill="#FF7A1A" stroke="#0B1F3A" stroke-width="4"/>

  <!-- casco de obra -->
  <path d="M96 128 C96 78 140 56 200 56 C260 56 304 78 304 128 Z" fill="#FF7A1A" stroke="#0B1F3A" stroke-width="6" stroke-linejoin="round"/>
  <rect x="86" y="120" width="228" height="16" rx="8" fill="#E86500" stroke="#0B1F3A" stroke-width="6"/>
  <rect x="186" y="58" width="28" height="62" rx="6" fill="#FFB170" stroke="#0B1F3A" stroke-width="4"/>

  <!-- cabeza -->
  <rect x="104" y="136" width="192" height="130" rx="34" fill="#2F6FED" stroke="#0B1F3A" stroke-width="6"/>
  <!-- orejas -->
  <rect x="82" y="178" width="22" height="46" rx="10" fill="#0B1F3A"/>
  <rect x="296" y="178" width="22" height="46" rx="10" fill="#0B1F3A"/>
  <!-- visor -->
  <rect x="124" y="160" width="152" height="80" rx="26" fill="#0B1F3A"/>
  <!-- ojos -->
  <circle cx="165" cy="198" r="19" fill="#7FE3FF"/>
  <circle cx="235" cy="198" r="19" fill="#7FE3FF"/>
  <circle cx="171" cy="192" r="6" fill="#FFFFFF"/>
  <circle cx="241" cy="192" r="6" fill="#FFFFFF"/>
  <!-- sonrisa -->
  <path d="M178 228 Q200 242 222 228" fill="none" stroke="#7FE3FF" stroke-width="5" stroke-linecap="round"/>

  <!-- cuello -->
  <rect x="180" y="266" width="40" height="18" fill="#0B1F3A"/>

  <!-- cuerpo -->
  <rect x="128" y="284" width="144" height="116" rx="28" fill="#2F6FED" stroke="#0B1F3A" stroke-width="6"/>
  <!-- panel pecho con retícula -->
  <rect x="152" y="306" width="96" height="58" rx="12" fill="#EAF2FF" stroke="#0B1F3A" stroke-width="4"/>
  <path d="M152 325 H248 M152 345 H248 M184 306 V364 M216 306 V364" stroke="#9DBBF5" stroke-width="2"/>
  <!-- mini casa en el panel -->
  <path d="M184 346 L200 330 L216 346 V360 H184 Z" fill="none" stroke="#0B1F3A" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="200" cy="384" r="6" fill="#FF7A1A"/>

  <!-- brazo izquierdo con rollo de planos -->
  <rect x="84" y="296" width="40" height="86" rx="18" fill="#2F6FED" stroke="#0B1F3A" stroke-width="6"/>
  <g transform="rotate(-18 96 380)">
    <rect x="62" y="340" width="26" height="92" rx="13" fill="#EAF2FF" stroke="#0B1F3A" stroke-width="5"/>
    <ellipse cx="75" cy="342" rx="13" ry="6" fill="#9DBBF5" stroke="#0B1F3A" stroke-width="4"/>
    <line x1="64" y1="372" x2="86" y2="372" stroke="#2F6FED" stroke-width="3"/>
    <line x1="64" y1="388" x2="86" y2="388" stroke="#2F6FED" stroke-width="3"/>
  </g>

  <!-- brazo derecho saludando -->
  <g transform="rotate(-28 290 300)">
    <rect x="276" y="276" width="40" height="86" rx="18" fill="#2F6FED" stroke="#0B1F3A" stroke-width="6"/>
    <circle cx="296" cy="368" r="15" fill="#0B1F3A"/>
  </g>
</svg>